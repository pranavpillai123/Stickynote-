<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StickyBoard — Beautiful Sticky Notes</title>
  <meta name="description" content="A beautiful, drag-and-drop sticky note app to organize your thoughts, todos, and ideas." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" id="flatpickr-theme" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>
<body>
  <!-- ========== HEADER ========== -->
  <header id="app-header">
    <div class="header-left">
      <div class="logo" id="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect x="2" y="2" width="24" height="24" rx="6" fill="url(#logoGrad)" />
          <rect x="6" y="8" width="16" height="2" rx="1" fill="#fff" opacity=".7"/>
          <rect x="6" y="13" width="12" height="2" rx="1" fill="#fff" opacity=".5"/>
          <rect x="6" y="18" width="8" height="2" rx="1" fill="#fff" opacity=".3"/>
          <defs>
            <linearGradient id="logoGrad" x1="2" y1="2" x2="26" y2="26" gradientUnits="userSpaceOnUse">
              <stop stop-color="#7c3aed"/>
              <stop offset="1" stop-color="#f472b6"/>
            </linearGradient>
          </defs>
        </svg>
        <h1>StickyBoard</h1>
      </div>
    </div>

    <div class="header-center">
      <div class="search-bar" id="search-bar">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="Search notes…" autocomplete="off" />
      </div>
    </div>

    <div class="header-right">
      <div class="user-badge" id="user-badge">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span id="user-display-name">User</span>
      </div>
      <button class="btn-icon btn-logout" id="btn-logout" title="Sign out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
      <button class="btn-icon" id="btn-toggle-theme" title="Toggle dark/light mode">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="btn-icon" id="btn-sort-notes" title="Sort by Reminder">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5h10M11 9h7M11 13h4M3 17l3 3 3-3M6 18V4"/>
        </svg>
      </button>
      <button class="btn-primary" id="btn-add-note">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>New Note</span>
      </button>
    </div>
  </header>

  <!-- ========== BOARD ========== -->
  <main id="board">
    <!-- Notes are rendered here dynamically -->
    <div class="empty-state" id="empty-state">
      <div class="empty-illustration">
        <svg width="120" height="120" viewBox="0 0 120 120" fill="none">
          <rect x="20" y="25" width="50" height="55" rx="6" fill="url(#e1)" transform="rotate(-8 45 52)"/>
          <rect x="50" y="20" width="50" height="55" rx="6" fill="url(#e2)" transform="rotate(5 75 47)"/>
          <rect x="35" y="40" width="50" height="55" rx="6" fill="url(#e3)" transform="rotate(-2 60 67)"/>
          <defs>
            <linearGradient id="e1" x1="20" y1="25" x2="70" y2="80"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
            <linearGradient id="e2" x1="50" y1="20" x2="100" y2="75"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
            <linearGradient id="e3" x1="35" y1="40" x2="85" y2="95"><stop stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient>
          </defs>
        </svg>
      </div>
      <h2>No notes yet</h2>
      <p>Click <strong>"New Note"</strong> to start capturing your ideas!</p>
    </div>

    <div class="board-section" id="timed-section" style="display: none;">
      <h3 class="section-title">Reminders</h3>
      <div class="board-grid" id="timed-board"></div>
    </div>
    
    <div class="board-section" id="untimed-section" style="display: none;">
      <h3 class="section-title">Notes</h3>
      <div class="board-grid" id="untimed-board"></div>
    </div>
  </main>

  <!-- ========== COLOR PICKER POPOVER (re-used) ========== -->
  <div class="color-picker-popover" id="color-picker-popover">
    <div class="color-picker-grid" id="color-picker-grid"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
